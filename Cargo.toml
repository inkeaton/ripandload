[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ripandload-core = { path = "crates/ripandload-core" }
eframe = { version = "0.37", features = ["glow"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
toml_edit = "0.25"
directories = "6"
thiserror = "2"
which = "8"
rfd = "0.17"
tempfile = "3"
ureq = "3"
serde_json = "1"

# Doc-comment lints, one per rule in docs/style/comments-rust.md (Tooling).
# Kept at warn so builds don't stop; dev/check.sh denies warnings.
[workspace.lints.rust]
missing_docs = "warn"
unused_doc_comments = "warn"

[workspace.lints.clippy]
missing_docs_in_private_items = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
doc_markdown = "warn"
too_long_first_doc_paragraph = "warn"
doc_lazy_continuation = "warn"
doc_overindented_list_items = "warn"
# Explicit `return`s are kept for readability.
needless_return = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
strip = true

# Release speed, but keeps the console window (see main.rs) so logs are visible.
# Used to diagnose Windows rendering issues.
[profile.release-console]
inherits = "release"
debug-assertions = true
